server:
  port: 8085

spring:
  application:
    name: crackhash-manager

  mongodb:
    uri: mongodb://${MONGO_DB_USER}:${MONGO_DB_PASSWORD}@${MONGO_DB_HOSTS}/${MONGO_DB}?${MONGO_DB_ARGS}
    representation:
      uuid: standard

send-type: ${SEND_TYPE:rest}

cluster:
  config-type: ${CLUSTER_CONFIG_TYPE:FILE}
  info-path: ${CLUSTER_INFO_PATH:./config/clusterInfo.yaml}
  worker-number: ${WORKER_NUMBER:1}
  worker-uris: ${WORKER_URIS:localhost:8086}

crack-hash:
  task:
    in_process_lifetime-duration-threshold: PT10S
    half_ready_lifetime-duration-threshold: PT20S

  kafka:
    producer:
      config:
        bootstrap-servers: ${KAFKA_URL:localhost:9092}
        key-serializer: org.apache.kafka.common.serialization.StringSerializer
        value-serializer: org.apache.kafka.common.serialization.StringSerializer
        retries: 0
        acks: -1
      topic: crackhash_task_request_topic
    consumer:
      config:
        bootstrap-servers: ${KAFKA_URL:localhost:9092}
        key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
        group-id: crackhash_task_result_group_id
        auto-offset-reset: earliest
      topic: crackhash_task_result_topic
