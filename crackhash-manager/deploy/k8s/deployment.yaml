apiVersion: apps/v1
kind: Deployment
metadata:
  name: manager
  namespace: imp-manager
  labels:
    app: manager
    env: test
    sprint: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: manager
      env: test
  template:
    metadata:
      labels:
        app: manager
        env: test
    spec:
      nodeSelector:
        sprint1-manager: "true"

      containers:
        - name: manager
          image: manager:0.4.1
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - configMapRef:
                name: manager-configmap
            - secretRef:
                name: manager-secrets

          volumeMounts:
            - name: manager-cluster-config
              mountPath: /app/config
              readOnly: true

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "768Mi"

          startupProbe:
            httpGet:
              path: /manager/health
              port: http
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /manager/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2

      volumes:
        - name: manager-cluster-config
          configMap:
            name: manager-configmap
            items:
              - key: clusterConfig.yaml
                path: clusterConfig.yaml